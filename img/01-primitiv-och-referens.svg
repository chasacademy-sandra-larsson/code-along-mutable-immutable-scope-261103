<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img"><defs><filter id="rpr" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="380"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="14"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></defs><rect width="960" height="380" fill="#FFFFFF"/><path d="M480,30 V350" stroke="#D4D4D4" stroke-width="2" stroke-dasharray="6 8"/><text x="40" y="50" font-family="'Sofia Sans',Tahoma,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">Primitiv</text><text x="40" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="400" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">let x = 5;</text><text x="40" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="400" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">let y = x;</text><text x="86" y="200.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" text-anchor="end" fill="#2B2F2F" opacity="1" style="white-space:pre">x</text><rect x="100" y="160" width="110" height="64" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#2B2F2F" stroke-width="2.5" filter="url(#rpr)"/><text x="155.0" y="202.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="400" text-anchor="middle" fill="#2B2F2F" opacity="1" style="white-space:pre">5</text><text x="86" y="300.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" text-anchor="end" fill="#2B2F2F" opacity="1" style="white-space:pre">y</text><rect x="100" y="260" width="110" height="64" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#2B2F2F" stroke-width="2.5" filter="url(#rpr)"/><text x="155.0" y="302.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="400" text-anchor="middle" fill="#2B2F2F" opacity="1" style="white-space:pre">5</text><text x="250" y="210" font-family="'Sofia Sans',Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">Värdet kopieras</text><text x="250" y="238" font-family="'Sofia Sans',Tahoma,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">in i lådan.</text><text x="250" y="290" font-family="'Sofia Sans',Tahoma,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">Två lådor, två femmor.</text><text x="520" y="50" font-family="'Sofia Sans',Tahoma,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">Referens</text><text x="520" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="400" text-anchor="start" fill="#2B2F2F" opacity="1" style="white-space:pre">const a = [1, 2, 3];</text><text x="570" y="150" font-family="'Sofia Sans',Tahoma,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#2B2F2F" opacity="0.55" style="white-space:pre">VARIABEL</text><text x="740" y="150" font-family="'Sofia Sans',Tahoma,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#2B2F2F" opacity="0.55" style="white-space:pre">MINNET</text><text x="556" y="210.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" text-anchor="end" fill="#2B2F2F" opacity="1" style="white-space:pre">a</text><rect x="570" y="170" width="110" height="64" rx="6" fill="#FFFFFF" fill-opacity="1" stroke="#2B2F2F" stroke-width="2.5" filter="url(#rpr)"/><circle cx="625.0" cy="202.0" r="6" fill="#2B2F2F"/><rect x="740" y="170" width="58" height="64" rx="3" fill="#6EC4E4" fill-opacity="0.4"